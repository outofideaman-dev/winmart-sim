<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445"><rect width="100%" height="100%" fill="#ffffff"/><text x="35" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f2942">Cơ chế Robot CP tự chất thùng xe trên dải 12 Dock xuất (DX1–DX12)</text><text x="35" y="56" font-family="Arial, sans-serif" font-size="14" fill="#475569">Tận dụng bàn nâng cơ khí có sẵn của kho thuê · Lắp 12 bộ khóa chèn bánh &amp; cảm biến liên động (D2) + mốc quang học (D1)</text><rect x="60" y="95" width="620" height="220" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8" rx="4"/><rect x="82" y="158" width="120" height="96" fill="#bbf7d0" stroke="#15803d" stroke-width="1.4" rx="3"/><text x="142" y="205" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#14532d">P0</text><text x="142" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">y = -5,6 m</text><rect x="214" y="158" width="120" height="96" fill="#bbf7d0" stroke="#15803d" stroke-width="1.4" rx="3"/><text x="274" y="205" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#14532d">P1</text><text x="274" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">y = -4,3 m</text><rect x="346" y="158" width="120" height="96" fill="#bbf7d0" stroke="#15803d" stroke-width="1.4" rx="3"/><text x="406" y="205" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#14532d">P2</text><text x="406" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">y = -3,0 m</text><rect x="478" y="158" width="120" height="96" fill="#dcfce7" stroke="#15803d" stroke-width="1.4" rx="3"/><text x="538" y="205" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#14532d">P3</text><text x="538" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">y = -1,7 m</text><text x="82" y="122" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#14532d">Đầu thùng (xếp trước)</text><text x="590" y="122" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#14532d">Cửa thùng</text><rect x="680" y="145" width="165" height="120" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="762" y="198" font-family="Arial, sans-serif" font-size="13.5" fill="#163047" text-anchor="middle" font-weight="bold">Bàn nâng cơ khí</text><text x="762" y="218" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155">2,0 m + Khóa D2</text><path d="M893.2 95L893.2 315" stroke="#1d65a6" stroke-width="1.5" fill="none" /><path d="M896.8 95L896.8 315" stroke="#1d65a6" stroke-width="1.5" fill="none" /><text x="908" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d65a6">Trục CP</text><text x="908" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d65a6">2 chiều</text><text x="908" y="161" font-family="Arial, sans-serif" font-size="12" fill="#1d65a6">(y = 3,4 m)</text><path d="M890 142L145 142" stroke="#1d65a6" stroke-width="2.2" fill="none" /><path d="M145 275L890 275" stroke="#c26a15" stroke-width="2.2" fill="none" /><text x="280" y="134" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1d65a6">1. Tiến vào 0,25 m/s tới ô sâu nhất còn trống</text><text x="250" y="298" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#9a3412">2. Hạ pallet, lùi thẳng ra trục y = 3,4 m → nhả khóa dock &amp; nối ngay lệnh mới</text><text x="35" y="355" font-family="Arial, sans-serif" font-size="14.5" fill="#163047" >• Kích thước lòng thùng yêu cầu: 6,4 × 2,4 × 2,5 m; cửa thông thủy ≥ 2,35 × 2,4 m; tải trọng hàng cho phép ≥ 4.500 kg.</text><text x="35" y="383" font-family="Arial, sans-serif" font-size="14.5" fill="#163047" >• Xếp đồng thời nhiều tuyến trên 12 dock xuất (7 bến trước khu Ghép + 5 bến trước Chờ xuất); tối đa 1 robot/thùng tại một thời điểm.</text><text x="35" y="411" font-family="Arial, sans-serif" font-size="14.5" fill="#163047" >• An toàn sự cố: Robot dừng lỗi trên bàn nâng hoặc trong thùng lập tức giữ khóa chèn bánh, cấm xe rời bến tới khi phục hồi.</text></svg>